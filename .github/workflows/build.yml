name: Build APK
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier android s'il manque
        run: |
          if [ ! -d android ]; then flutter create --platforms android --org com.invlab --project-name sifa .; fi
      - name: Permissions Android (Internet, localisation)
        run: python3 tools/patch_manifest.py
      - name: Compatibilité JVM des plugins (tflite_flutter : Java 1.8 / Kotlin 17)
        run: echo "kotlin.jvm.target.validation.mode=IGNORE" >> android/gradle.properties
      - name: Signature fixe (même empreinte SHA-1 à chaque build)
        run: python3 tools/patch_signing.py
        env:
          SIFA_KS: ${{ github.workspace }}/tools/sifa-test.jks
      - run: flutter pub get
      - name: Icône SIFA (remplace l'icône Flutter)
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: APK léger (release, arm64 uniquement)
        env:
          SIFA_KS: ${{ github.workspace }}/tools/sifa-test.jks
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols
          ls -l build/app/outputs/flutter-apk/
          echo "Taille APK :" && du -h build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -i "SHA-1" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sifa-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
