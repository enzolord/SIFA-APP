name: Build APK
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier android s'il manque
        run: |
          if [ ! -d android ]; then flutter create --platforms android --org com.invlab --project-name sifa .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: sifa-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
