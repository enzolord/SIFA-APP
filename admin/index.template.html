<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIFA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : barre latérale de navigation + zone de travail à cartes ; sur téléphone, la navigation devient une rangée défilante. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --sunken:#e9efe9; --ink:#0e2f25; --muted:#587066; --line:#d9e3dc;
  --brand:#0f7a56; --brand-ink:#ffffff; --brand-soft:#d9eee4; --yolk:#e3a912;
  --ok:#17794f; --ok-soft:#d8efe2; --warn:#8a5a00; --warn-soft:#fbecc4; --bad:#b3261e; --bad-soft:#fbe0dc;
  --c1:#0f7a56; --c2:#e3a912; --c3:#2f6fb5; --c4:#b5532f; --c5:#7a5bb5; --grid:#dfe7e1;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --side:240px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1612; --surface:#15221c; --sunken:#1b2b24; --ink:#e6f0ea; --muted:#93aa9f; --line:#27382f;
  --brand:#3fbf8a; --brand-ink:#06261a; --brand-soft:#1c3a2d; --yolk:#f0bd2e;
  --ok:#5dd49b; --ok-soft:#173a2a; --warn:#f0c15a; --warn-soft:#3b2f10; --bad:#ff8f84; --bad-soft:#40201c;
  --c1:#3fbf8a; --c2:#f0bd2e; --c3:#6fa8e8; --c4:#e8946f; --c5:#a58ae0; --grid:#25352d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1612; --surface:#15221c; --sunken:#1b2b24; --ink:#e6f0ea; --muted:#93aa9f; --line:#27382f;
  --brand:#3fbf8a; --brand-ink:#06261a; --brand-soft:#1c3a2d; --yolk:#f0bd2e;
  --ok:#5dd49b; --ok-soft:#173a2a; --warn:#f0c15a; --warn-soft:#3b2f10; --bad:#ff8f84; --bad-soft:#40201c;
  --c1:#3fbf8a; --c2:#f0bd2e; --c3:#6fa8e8; --c4:#e8946f; --c5:#a58ae0; --grid:#25352d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}

/* connexion */
#login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.login-card h1{margin-bottom:6px}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px}
.brandmark i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:16px}

/* cadre */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .brandmark{padding:2px 8px 16px}
.nav-group{margin:14px 8px 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--sunken)}
nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav .badge{margin-left:auto}
main{padding:20px max(20px,env(safe-area-inset-right,0px)) 60px 24px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.stamp{font-size:13px;color:var(--muted)}

/* composants */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
#view>*+*{margin-top:16px}
.grid>*{margin-top:0!important}
.card .card{margin-top:0}
.card h2{margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)}
.chart{position:relative;height:260px}
.chart.tall{height:340px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.badge{min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;text-align:center;font-weight:700}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label.f{display:block;font-weight:600;font-size:13.5px;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;margin:8px 0;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunken);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:var(--sunken);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar.bad>i{background:var(--bad)}
.note{padding:12px 14px;border-radius:10px;background:var(--sunken);color:var(--ink);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
.item .head{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.phone{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.preview{border-radius:14px;padding:14px;display:flex;gap:10px}
.preview.info{background:#ddeee5;color:#0e2f25}.preview.warn{background:#fdf0cc;color:#0e2f25}.preview.danger{background:#fbe4df;color:#0e2f25}
.report h2{margin:22px 0 6px} .report p,.report li{max-width:70ch}
.report ul{padding-left:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

@media (max-width: 860px){
  #app{display:block}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 8px}
  aside .brandmark{padding:2px 8px 8px}
  nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
  nav button{white-space:nowrap;width:auto}
  .nav-group{display:none}
  main{padding:16px max(16px,env(safe-area-inset-left,0px)) 60px}
}
@media print{
  aside,.topbar .right,.actions,.noprint,.toast{display:none!important}
  #app{display:block} body{background:#fff;color:#000} .card,.kpi{border-color:#bbb;break-inside:avoid}
  main{padding:0}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brandmark"><i>S</i> SIFA Admin</div>
    <h1 style="margin-top:18px">Connexion</h1>
    <p class="muted" style="margin:6px 0 4px">Réservé aux administrateurs de SIFA.</p>
    <label class="f" for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username" required>
    <label class="f" for="pwd">Mot de passe</label>
    <input type="password" id="pwd" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit" id="btnLogin">Se connecter</button></div>
    <p id="loginMsg" class="note bad hidden" style="margin-top:14px"></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brandmark"><i>S</i> SIFA Admin</div>
    <nav id="nav" aria-label="Sections"></nav>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">Vue d'ensemble</h1>
      <div class="right">
        <span class="stamp" id="stamp"></span>
        <div class="seg" id="period" role="group" aria-label="Période"></div>
        <button class="btn sec small" id="btnRefresh">Actualiser</button>
        <button class="btn sec small" id="btnLogout">Déconnexion</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script id="fiches-base" type="application/json">__FICHES_BASE__</script>
<script>
'use strict';
/* ───────────── Connexion à Supabase (clé publique : la sécurité repose sur les règles RLS) ───────────── */
const URL_ = 'https://qprgpmmvdjrmslfsraae.supabase.co';
const KEY = 'sb_publishable_HfgFOYXWuyNAWrjDGWJjiA_7jSssFOK';
const memStore = {}; 
const safeStorage = {
  getItem: k => { try { return localStorage.getItem(k); } catch (_) { return memStore[k] ?? null; } },
  setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { memStore[k] = v; } },
  removeItem: k => { try { localStorage.removeItem(k); } catch (_) { delete memStore[k]; } },
};
const sb = supabase.createClient(URL_, KEY, { auth: { storage: safeStorage } });
const BASE = JSON.parse(document.getElementById('fiches-base').textContent);

/* ───────────── Outils ───────────── */
const $ = id => document.getElementById(id);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const nf = n => (n == null ? '—' : Number(n).toLocaleString('fr-FR'));
const pct = (a, b, d = 0) => (b > 0 ? (100 * a / b).toFixed(d).replace('.', ',') + ' %' : '—');
const ratio = (a, b) => (b > 0 ? a / b : null);
const fdate = s => (s ? new Date(s).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—');
let toastTimer;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), bad ? 6000 : 2800);
}
/* Bouton à double clic : le premier clic demande confirmation. */
function armed(label, action, cls = 'btn small danger') {
  const b = h('button', { class: cls, type: 'button' }, label);
  let t;
  b.addEventListener('click', () => {
    if (b.dataset.armed) { clearTimeout(t); delete b.dataset.armed; b.textContent = label; action(); return; }
    b.dataset.armed = '1'; b.textContent = 'Confirmer ?';
    t = setTimeout(() => { delete b.dataset.armed; b.textContent = label; }, 3500);
  });
  return b;
}
function fail(e, ctx) { console.error(ctx, e); toast((ctx ? ctx + ' : ' : '') + (e?.message || e), true); }
async function must(promise) { const { data, error } = await promise; if (error) throw error; return data; }

const L = {
  maladie: { healthy: 'Fiente saine', coccidiosis: 'Coccidiose', salmonella: 'Salmonellose', newcastle: 'Newcastle', autre: 'Autre maladie', inconnue: 'Inconnue', inconnu: 'Inconnue' },
  issue: { ok: 'Photo acceptée', notDropping: 'Pas une fiente', tooDark: 'Trop sombre', tooPlain: 'Surface unie', unclear: 'Photo peu claire', modelError: 'Erreur du modèle', inconnu: '—' },
  gemini: { dropping: 'Gemini : fiente', notDropping: 'Gemini : autre chose', unknown: 'Gemini : sans réponse', absent: 'Non interrogé' },
  fiab: { high: 'Forte', medium: 'Moyenne', low: 'Faible', inconnu: '—' },
  ecran: {
    Accueil: 'Accueil', Historique: 'Historique', Scanner: 'Scanner', Communaute: 'Communauté', Profil: 'Profil',
    SignsScreen: 'Questions sur les signes', ResultScreen: 'Résultat', RemedesScreen: 'Remèdes et conseils', AbonnementScreen: 'Formules',
    NewPostScreen: 'Nouvelle publication', PostDetailScreen: 'Détail d’une publication', GroupDetailScreen: 'Groupe de discussion',
    BandsScreen: 'Mes bandes', BandDetailScreen: 'Détail d’une bande', EntryScreen: 'Saisie journalière',
    'Calendrier de vaccination': 'Calendrier de vaccination', 'Pharmacies vétérinaires': 'Pharmacies vétérinaires', 'Fiches maladies': 'Fiches maladies',
  },
  action: {
    appel_pharmacie: 'Appel d’une pharmacie', itineraire_maps: 'Itinéraire (Google Maps)', itineraire_carte: 'Itinéraire sur la carte',
    connexion_google: 'Connexion Google', code_active: 'Code d’activation utilisé',
  },
};
const lab = (dict, k) => dict[k] ?? (k && k.startsWith?.('tuile:') ? 'Accueil › ' + k.slice(6) : k ?? '—');
const MALADIES = ['healthy', 'coccidiosis', 'salmonella', 'newcastle'];

/* Graphiques : couleurs lues dans les variables CSS pour suivre le thème. */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const charts = [];
function chart(canvas, cfg) {
  const ink = css('--muted'), grid = css('--grid');
  Chart.defaults.font.family = css('--font-body'); Chart.defaults.color = ink;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false }, cfg.options || {});
  if (cfg.options.scales) for (const s of Object.values(cfg.options.scales)) { s.grid = Object.assign({ color: grid }, s.grid); s.ticks = Object.assign({ precision: 0 }, s.ticks); }
  const c = new Chart(canvas, cfg); charts.push(c); return c;
}
function killCharts() { while (charts.length) charts.pop().destroy(); }
function chartBox(cls = '') { const c = h('canvas'); return [h('div', { class: 'chart ' + cls }, c), c]; }

/* ───────────── État ───────────── */
const S = { days: 30, stats: null, me: null, section: 'overview', badges: {} };
const DAYS = [7, 30, 90, 365];

/* ───────────── Accès aux données ───────────── */
async function loadStats() {
  S.stats = await must(sb.rpc('stats_admin', { p_jours: S.days }));
  $('stamp').textContent = 'Mis à jour ' + fdate(S.stats.genere_le);
  return S.stats;
}
const getC = async key => (await must(sb.from('contenu').select('valeur').eq('cle', key).maybeSingle()))?.valeur ?? {};
const setC = async (key, valeur) => must(sb.from('contenu').upsert({ cle: key, valeur }));

/* ───────────── Sections ───────────── */
const SECTIONS = [
  { group: 'Pilotage' },
  { id: 'overview', label: 'Vue d’ensemble', render: renderOverview },
  { id: 'usage', label: 'Utilisation', render: renderUsage },
  { id: 'quality', label: 'Qualité des réponses', render: renderQuality },
  { id: 'reports', label: 'Rapports et exports', render: renderReports },
  { group: 'Contenu de l’application' },
  { id: 'announce', label: 'Annonce et maintenance', render: renderAnnounce },
  { id: 'plans', label: 'Formules et codes', render: renderPlans },
  { id: 'pharmacies', label: 'Pharmacies', render: renderPharmacies },
  { id: 'sheets', label: 'Fiches maladies', render: renderSheets },
  { group: 'Gestion' },
  { id: 'community', label: 'Communauté', render: renderCommunity },
  { id: 'users', label: 'Utilisateurs', render: renderUsers },
  { id: 'model', label: 'Modèle d’analyse', render: renderModel },
];
function buildNav() {
  const nav = $('nav'); nav.replaceChildren();
  for (const s of SECTIONS) {
    if (s.group) { nav.append(h('div', { class: 'nav-group' }, s.group)); continue; }
    const b = h('button', { type: 'button', 'data-id': s.id, onclick: () => go(s.id) }, s.label);
    if (S.badges[s.id]) b.append(h('span', { class: 'badge' }, S.badges[s.id]));
    if (s.id === S.section) b.setAttribute('aria-current', 'page');
    nav.append(b);
  }
}
function buildPeriod() {
  const box = $('period'); box.replaceChildren();
  for (const d of DAYS) box.append(h('button', { type: 'button', 'aria-pressed': String(d === S.days), onclick: () => { S.days = d; buildPeriod(); go(S.section); } }, d === 365 ? '1 an' : d + ' j'));
  box.classList.toggle('hidden', !['overview', 'usage', 'quality', 'reports'].includes(S.section));
}
async function go(id) {
  S.section = id;
  const sec = SECTIONS.find(s => s.id === id);
  $('title').textContent = sec.label; buildNav(); buildPeriod(); killCharts();
  const view = $('view'); view.replaceChildren(h('div', { class: 'empty' }, 'Chargement…'));
  try { const node = await sec.render(); view.replaceChildren(...[].concat(node).flat().filter(Boolean)); }
  catch (e) { view.replaceChildren(h('div', { class: 'note bad' }, 'Impossible de charger cette section : ' + (e?.message || e), h('br'), e?.message?.includes('stats_admin') ? 'Exécutez supabase/admin.sql dans Supabase (SQL Editor).' : '')); console.error(e); }
  window.scrollTo(0, 0);
}

/* ═════════════ Vue d'ensemble ═════════════ */
function kpi(label, value, detail, cls = '') { return h('div', { class: 'kpi ' + cls }, h('div', { class: 'l' }, label), h('div', { class: 'v' }, value), detail ? h('div', { class: 'd' }, detail) : null); }

async function renderOverview() {
  const s = await loadStats(), u = s.utilisateurs, q = s.qualite, a = s.analyses;
  const okRate = ratio(q.justes, q.retours);
  const stick = ratio(u.actifs_24h, u.actifs_30j);
  const [c1, cv1] = chartBox(), [c2, cv2] = chartBox();
  const todos = await buildTodos(s);
  S.badges = { quality: 0, community: s.communaute.signalements_periode || 0, pharmacies: s.pharmacies.perimees || 0 };
  buildNav();
  const node = [
    h('div', { class: 'kpis' },
      kpi('Utilisateurs actifs', nf(u.actifs_periode), `${nf(u.actifs_24h)} aujourd’hui · ${nf(u.actifs_7j)} sur 7 j`),

/* Liste « à surveiller », déduite des statistiques et du contenu publié. */
async function buildTodos(s) {
  const items = [];
  const add = (level, title, text, go_) => items.push({ level, title, text, go_ });
  const [annonce, maint] = await Promise.all([getC('annonce').catch(() => ({})), getC('maintenance').catch(() => ({}))]);
  if (maint.actif) add('bad', 'Maintenance activée', 'Les éleveurs voient un écran de maintenance à la place de l’application.', 'announce');
  if (annonce.actif) add('ok', 'Une annonce est affichée', 'Elle apparaît en haut de l’accueil de l’application.', 'announce');
  const q = s.qualite, okRate = ratio(q.justes, q.retours);
  if (q.retours < 30) add('warn', 'Peu d’avis reçus', `${q.retours} avis pour ${s.analyses.total} analyses : trop peu pour juger la fiabilité. Il faut au moins 30 avis.`, 'quality');
  else if (okRate < .7) add('bad', 'Taux de bonnes réponses bas', `${pct(q.justes, q.retours)} de bonnes réponses. Voir quelles maladies sont confondues et ré-entraîner le modèle.`, 'quality');
  else add('ok', 'Taux de bonnes réponses correct', `${pct(q.justes, q.retours)} sur ${q.retours} avis.`, 'quality');
  if (s.communaute.signalements_periode > 0) add('warn', 'Publications signalées', `${s.communaute.signalements_periode} signalement(s) sur la période.`, 'community');
  if (s.pharmacies.perimees > 0) add('warn', 'Stocks de pharmacies anciens', `${s.pharmacies.perimees} pharmacie(s) dont le stock n’a pas été mis à jour depuis 30 jours.`, 'pharmacies');
  if (s.pharmacies.actives === 0) add('warn', 'Aucune pharmacie enregistrée', 'L’application affiche encore l’exemple intégré (non réel) tant que la liste est vide.', 'pharmacies');
  const sc = s.scans, gem = sc.gemini || {}, totalG = Object.values(gem).reduce((x, y) => x + y, 0);
  if (totalG >= 20 && (gem.unknown || 0) + (gem.absent || 0) > .5 * totalG) add('warn', 'Gemini répond rarement', 'Plus de la moitié des photos n’ont pas été vérifiées en ligne : vérifiez la clé et le quota (section Modèle d’analyse).', 'model');
  if (!items.length) add('ok', 'Rien à signaler', 'Tout est en ordre.');
  return items.map(i => h('div', { class: 'todo' }, h('span', { class: 'pill ' + i.level }, i.level === 'ok' ? 'OK' : i.level === 'warn' ? 'À voir' : 'Urgent'), h('div', {}, h('b', {}, i.title), h('div', { class: 'muted' }, i.text), i.go_ ? h('button', { class: 'btn small sec', type: 'button', style: 'margin-top:6px', onclick: () => go(i.go_) }, 'Ouvrir') : null)));
}

/* ═════════════ Rapports ═════════════ */
function reportModel(s) {
  const u = s.utilisateurs, q = s.qualite, a = s.analyses, sc = s.scans, f = s.fonctionnalites, r = s.retention;
  const topD = Object.entries(a.par_maladie).sort((x, y) => y[1] - x[1])[0];
  const topS = f.ecrans.filter(x => !['Accueil', 'Historique', 'Scanner', 'Communaute', 'Profil'].includes(x.nom))[0];
  const rejected = Object.entries(sc.par_issue).filter(([k]) => k !== 'ok').reduce((x, [, v]) => x + v, 0);
  const okRate = ratio(q.justes, q.retours);
  const facts = [
    `${nf(u.actifs_periode)} éleveurs actifs sur ${s.periode_jours} jours, dont ${nf(u.nouveaux_periode)} nouveaux. ${nf(u.actifs_7j)} actifs sur les 7 derniers jours.`,
    `${nf(a.total)} analyses réalisées par ${nf(a.appareils)} éleveurs${topD ? `. Résultat le plus fréquent : ${lab(L.maladie, topD[0])} (${pct(topD[1], a.total)})` : ''}.`,
    q.retours ? `${pct(q.justes, q.retours)} de bonnes réponses et ${pct(q.faux, q.retours)} de mauvaises, sur ${nf(q.retours)} avis (${pct(q.retours, a.total)} des analyses).` : 'Aucun avis reçu sur la qualité des réponses.',
    `${nf(sc.total)} photos prises, dont ${pct(rejected, sc.total)} refusées.`,
    topS ? `Écran le plus utilisé (hors onglets) : ${lab(L.ecran, topS.nom)}, ${nf(topS.vues)} vues.` : 'Pas encore de données d’usage détaillées.',
    r.cohorte_7j ? `${pct(r.revenus_7j, r.cohorte_7j)} des éleveurs reviennent après 7 jours.` : 'Rétention à 7 jours : pas encore assez d’ancienneté.',
    `${nf(a.alertes)} alerte(s) grave(s) (signes nerveux ou mortalité brutale).`,
    `Communauté : ${nf(s.communaute.publications)} publications, ${nf(s.communaute.commentaires)} commentaires, ${nf(s.communaute.signalements_periode)} signalement(s).`,
  ];
  const recs = [];
  if (q.retours < SAMPLE_MIN) recs.push('Collecter davantage d’avis : moins de 30 réponses, impossible de juger la fiabilité du modèle.');
  else if (okRate < .7) recs.push('Taux de bonnes réponses sous 70 % : rassembler les cas faux, les faire valider par le vétérinaire et ré-entraîner le modèle.');
  if (sc.total && rejected / sc.total > .3) recs.push('Plus de 30 % des photos sont refusées : renforcer les conseils de cadrage dans l’écran de scan.');
  if (a.total && a.photo_seule / a.total > .5) recs.push('Plus de la moitié des analyses se font sans répondre aux questions : rendre les questions plus visibles.');
  if (r.cohorte_7j >= 20 && r.revenus_7j / r.cohorte_7j < .2) recs.push('Moins de 20 % des éleveurs reviennent après 7 jours : prévoir des rappels (calendrier de vaccination) et du contenu régulier.');
  if (s.pharmacies.perimees > 0) recs.push(`Mettre à jour le stock de ${s.pharmacies.perimees} pharmacie(s).`);
  if (s.communaute.signalements_periode > 0) recs.push('Traiter les publications signalées dans la section Communauté.');
  if (!recs.length) recs.push('Aucune action urgente. Continuer à collecter des avis pour suivre la fiabilité.');
  return { facts, recs };
}

    const rows = users.filter(u => !t || [u.nom, u.email, u.telephone, u.ville, u.ferme].some(x => (x || '').toLowerCase().includes(t)));
    body.replaceChildren(h('p', { class: 'muted' }, `${nf(rows.length)} compte(s)`), h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, ['Nom', 'Contact', 'Ville / ferme', 'Élevage', 'Formule', 'Rôle', 'Inscrit'].map(x => h('th', {}, x)))),
      h('tbody', {}, rows.length ? rows.slice(0, 300).map(u => {
        const sel = h('select', {}, ['eleveur', 'veterinaire', 'admin'].map(r => h('option', { value: r, selected: r === u.role }, r === 'eleveur' ? 'Éleveur' : r === 'veterinaire' ? 'Vétérinaire' : 'Administrateur')));
        sel.addEventListener('change', async () => { if (u.id === S.me.id) { sel.value = u.role; return toast('Vous ne pouvez pas changer votre propre rôle.', true); } try { await must(sb.from('profiles').update({ role: sel.value }).eq('id', u.id)); u.role = sel.value; toast('Rôle modifié.'); } catch (e) { sel.value = u.role; fail(e, 'Modification'); } });
        const s = sub[u.id];
        return h('tr', {}, h('td', {}, h('b', {}, u.nom || '—')), h('td', {}, h('div', {}, u.email || ''), h('div', { class: 'muted' }, u.telephone || '')), h('td', {}, [u.ville, u.ferme].filter(Boolean).join(' · ') || '—'),
          h('td', {}, u.type_elevage === 'chair' ? 'Chair' : u.type_elevage === 'pondeuse' ? 'Pondeuses' : 'Mixte'), h('td', {}, s ? h('span', { class: 'pill ok' }, s.formule) : h('span', { class: 'pill' }, 'Essai')), h('td', {}, sel), h('td', {}, fdate(u.created_at)));
      }) : h('tr', {}, h('td', { colspan: 7, class: 'empty' }, 'Aucun compte.'))))));
  }
  q.addEventListener('input', draw); draw();
  return h('div', { class: 'card' }, h('h2', {}, 'Comptes connectés'), h('p', { class: 'sub' }, 'Les éleveurs qui se sont connectés avec Google. Les autres utilisateurs sont comptés anonymement dans les statistiques.'), q, h('div', { style: 'margin-top:12px' }, body));
}

/* ═════════════ Modèle d'analyse ═════════════ */
const pubUrl = f => `${URL_}/storage/v1/object/public/modeles/${f}?t=${Date.now()}`;
const hex = async buf => [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
async function renderModel() {
  let cur = null;
  try { const r = await fetch(pubUrl('manifest.json')); if (r.ok) cur = await r.json(); } catch (_) {}
  const info = h('div'), hist = h('div'), check = h('div', { class: 'muted', style: 'margin-top:8px' }), gem = h('div', { style: 'margin-top:10px' });
  let model = null, labels = null;
  const bt = h('button', { class: 'btn', type: 'button', disabled: true }, 'Publier pour tous les téléphones');
  const fM = h('input', { type: 'file', accept: '.tflite' }), fL = h('input', { type: 'file', accept: '.json' });
  info.replaceChildren(cur ? h('p', {}, 'Version publiée : ', h('b', {}, cur.version), ` · ${(cur.taille / 1e6).toFixed(1)} Mo · étiquettes : ${cur.labels.join(', ')}`) : h('p', { class: 'muted' }, 'Aucun modèle publié : les téléphones utilisent celui livré dans l’application (version 1).'));
  async function validate() {
    bt.disabled = true; const out = [];
    try {
      if (fL.files[0]) { labels = JSON.parse(await fL.files[0].text()); if (!Array.isArray(labels) || !labels.every(x => typeof x === 'string')) throw new Error('labels.json doit être une liste de textes.');
        const low = labels.join(' ').toLowerCase(); const miss = ['cocci', 'salmo', 'castle', 'health'].filter(k => !low.includes(k)); if (miss.length) throw new Error('Étiquettes manquantes : ' + miss.join(', ')); out.push('✔ Étiquettes : ' + labels.join(', ')); }
      if (fM.files[0]) { model = await fM.files[0].arrayBuffer(); if (model.byteLength < 1e5 || model.byteLength > 6e7) throw new Error('Taille de modèle inattendue.'); out.push(`✔ Modèle : ${(model.byteLength / 1e6).toFixed(1)} Mo`); }
      if (model && labels) { out.push(`→ sera publié en version ${(cur ? cur.version : 1) + 1}`); bt.disabled = false; }
      check.className = 'muted'; check.replaceChildren(...out.flatMap(x => [x, h('br')]));
    } catch (e) { check.className = 'note bad'; check.textContent = '✖ ' + e.message; }
  }
  fM.addEventListener('change', validate); fL.addEventListener('change', validate);
  const up = async (path, body, type) => { const { error } = await sb.storage.from('modeles').upload(path, body, { upsert: true, contentType: type, cacheControl: '0' }); if (error) throw new Error(path + ' : ' + error.message); };
  const publish = async m => { const txt = JSON.stringify(m, null, 2); await up(`manifest_v${m.version}.json`, new Blob([txt]), 'application/json'); await up('manifest.json', new Blob([txt]), 'application/json'); };
  bt.addEventListener('click', async () => {
    bt.disabled = true;
    try { const v = (cur ? cur.version : 1) + 1, name = `sifa_v${v}.tflite`; await up(name, new Blob([model]), 'application/octet-stream');
      await publish({ version: v, fichier: name, labels, sha256: await hex(model), taille: model.byteLength }); toast(`Version ${v} publiée.`); go('model'); }
    catch (e) { fail(e, 'Publication'); validate(); }
  });
  const { data: files } = await sb.storage.from('modeles').list('', { limit: 200 });
  const vs = (files || []).map(f => /^manifest_v(\d+)\.json$/.exec(f.name)).filter(Boolean).map(m => +m[1]).sort((a, b) => b - a);
  hist.replaceChildren(vs.length ? vs.map(v => h('div', { class: 'todo', style: 'align-items:center' }, h('div', { style: 'flex:1' }, 'Version ' + v, cur && cur.version === v ? h('span', { class: 'pill ok', style: 'margin-left:8px' }, 'en ligne') : null),
    armed('Remettre en ligne', async () => { try { const old = await (await fetch(pubUrl(`manifest_v${v}.json`))).json(); await publish({ ...old, version: (cur ? cur.version : 1) + 1 }); toast(`Contenu de la version ${v} republié.`); go('model'); } catch (e) { fail(e, 'Retour arrière'); } }, 'btn small sec'))) : h('p', { class: 'muted' }, 'Aucune version archivée.'));
  const gbtn = h('button', { class: 'btn sec', type: 'button', onclick: async () => {
    gem.className = 'muted'; gem.textContent = 'Test en cours…';
    try { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.fillStyle = '#888'; x.fillRect(0, 0, 64, 64);
      const img = c.toDataURL('image/jpeg', .9).split(',')[1].padEnd(200, 'A');
      const r = await fetch(`${URL_}/functions/v1/verifier-fiente`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ image: img }) });
      const j = await r.json().catch(() => ({}));
      const msg = r.ok ? ['ok', '✔ Gemini répond : la fonction et la clé sont en place.'] : r.status === 404 ? ['bad', '✖ La fonction verifier-fiente n’est pas déployée.'] : r.status === 503 ? ['bad', '✖ GEMINI_API_KEY est absente des secrets Supabase.'] : r.status === 401 ? ['bad', '✖ SIFA_APP_KEY ne correspond pas à la clé publishable.'] : r.status === 429 ? ['warn', 'Quota gratuit Gemini atteint : l’app utilise le modèle embarqué seul.'] : ['bad', `✖ Erreur ${r.status} : ${j.erreur || 'voir les logs de la fonction'}`];
      gem.className = 'note ' + msg[0]; gem.textContent = msg[1];
    } catch (e) { gem.className = 'note bad'; gem.textContent = '✖ ' + e.message; } } }, 'Tester Gemini');
  return [
    h('div', { class: 'card' }, h('h2', {}, 'Publier un nouveau modèle'), h('p', { class: 'sub' }, 'Choisissez les deux fichiers sortis de l’entraînement Colab. Version, empreinte et manifeste sont gérés automatiquement ; les téléphones le récupèrent au prochain lancement en ligne.'), info,
      h('label', { class: 'f' }, 'Fichier modèle (sifa_fp16.tflite)'), fM, h('label', { class: 'f' }, 'Fichier étiquettes (labels.json)'), fL, check, h('div', { class: 'actions' }, bt)),
    h('div', { class: 'card' }, h('h2', {}, 'Anciennes versions'), hist),
    h('div', { class: 'card' }, h('h2', {}, 'Vérification Gemini'), h('p', { class: 'sub' }, 'Contrôle que la fonction verifier-fiente est déployée et que la clé est enregistrée.'), gbtn, gem),
  ];
}

/* ───────────── Démarrage et connexion ───────────── */
async function enter(session) {
  if (!session) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
  const { data: me } = await sb.from('profiles').select('id,role,email').eq('id', session.user.id).maybeSingle();
  if (!me || me.role !== 'admin') {
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    const m = $('loginMsg'); m.classList.remove('hidden'); m.replaceChildren('Ce compte n’est pas administrateur. Dans Supabase (SQL Editor), exécutez :', h('br'), h('code', { class: 'mono' }, `update public.profiles set role = 'admin' where id = '${session.user.id}';`));
    await sb.auth.signOut(); return;
  }
  S.me = me; $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  buildNav(); buildPeriod(); go(S.section);
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('btnLogin'); b.disabled = true; $('loginMsg').classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pwd').value });
  b.disabled = false;
  if (error) { const m = $('loginMsg'); m.textContent = 'Connexion refusée : ' + error.message; m.classList.remove('hidden'); }
});
$('btnLogout').addEventListener('click', () => sb.auth.signOut());
$('btnRefresh').addEventListener('click', () => go(S.section));
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') enter(session); });
</script>
